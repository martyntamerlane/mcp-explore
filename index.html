<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Defence in depth for a page whose whole job is rendering untrusted input
         (ISSUE-14). GitHub Pages sends no security headers of its own, so this
         meta tag is the only place a policy can live.

         `connect-src *` is not a lapse: reaching a visitor's own MCP server at
         any address is the product. Everything else is shut — in particular
         `script-src 'self'`, which means no injected markup could load or inline
         a script even if something downstream ever did emit HTML.

         `'unsafe-eval'` is here under protest and should not stay (ISSUE-17).
         The MCP SDK validates a tool's structured output against the server's
         own `outputSchema`, and its default validator is AJV, which compiles
         each schema into a function with `new Function`. Without it, connecting
         to any server declaring an `outputSchema` dies with "Error compiling
         schema" — deepwiki among them. Note what that says beyond CSP: schemas
         arrive from an untrusted server and become code in the visitor's
         browser. The SDK takes a `jsonSchemaValidator` of our own, and a
         non-generating one would drop this back to plain `'self'` and remove
         the code generation with it.

         `style-src` needs 'unsafe-inline' for React's style attributes (table
         alignment in the markdown renderer, the motion library's animations).
         `font-src` needs `data:` because Vite inlines font subsets under its
         asset limit — verified against a real build, where 'self' alone blocked
         one of the woff2 faces.  `img-src data:` carries the favicon and the
         image resources a server can return as base64 blobs.
         `frame-ancestors` is deliberately absent: it is ignored in a meta tag,
         and Pages cannot send the header — so clickjacking stays unaddressed
         here rather than appearing to be handled. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'unsafe-eval';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data:;
               font-src 'self' data:;
               connect-src *;
               object-src 'none';
               base-uri 'none';
               form-action 'none';
               frame-src 'none'"
    />
    <title>mcp-explore</title>
    <!-- The prism mark (Prism.tsx variant "b"), inline so the tab needs no
         extra request. Both strokes swap for dark tab strips. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2048%2048%22%20fill%3D%22none%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cstyle%3E.i%7Bstroke%3A%23171b26%7D%40media%28prefers-color-scheme%3Adark%29%7B.i%7Bstroke%3A%23e8ebf4%7D%7D%3C%2Fstyle%3E%3Cg%20transform%3D%22translate%280%208%29%22%3E%3Cpath%20class%3D%22i%22%20d%3D%22M2%2016H18%22%2F%3E%3Cpath%20class%3D%22i%22%20d%3D%22M18%207%2034%2016%2018%2025Z%22%2F%3E%3Cpath%20d%3D%22M34%2016%2046%208%22%20stroke%3D%22%230891b2%22%2F%3E%3Cpath%20d%3D%22M34%2016H46%22%20stroke%3D%22%23b45309%22%2F%3E%3Cpath%20d%3D%22M34%2016%2046%2024%22%20stroke%3D%22%236d28d9%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E" />
  </head>
